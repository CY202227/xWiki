[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "xwiki"
version = "0.2.0"
description = "A small evidence-driven Wiki with model-assisted maintenance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.26.1,<4",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2.2,<2",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10"]
build = ["build>=1.3,<2"]

[project.scripts]
xwiki = "xwiki.__main__:main"

[project.urls]
Repository = "https://github.com/CY202227/xWiki"

[tool.setuptools.packages.find]
include = ["xwiki", "xwiki.*"]
